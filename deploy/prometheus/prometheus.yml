global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: outbox-relay
    static_configs: [{ targets: ["outbox-relay:9100"] }]
  - job_name: consumer
    static_configs: [{ targets: ["consumer:9100"] }]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{ targets: ["rabbitmq:15692"] }]
