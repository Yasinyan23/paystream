name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8: a release, pinned
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8: a release, pinned
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Unit and integration tests (testcontainers)
        run: uv run pytest --cov=paystream --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}  # the coverage of a failing run too
        with:
          name: coverage
          path: coverage.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8: a release, pinned
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start the stack
        run: |
          docker compose up -d --build
          timeout 180 bash -c 'until curl -sf http://localhost:8000/ready; do sleep 2; done'
      - name: End-to-end tests
        run: uv run pytest -m e2e tests/e2e -v
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
