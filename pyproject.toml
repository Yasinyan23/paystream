[project]
name = "paystream"
version = "0.1.0"
description = "Reliable async payment processing: FastAPI + FastStream + PostgreSQL transactional outbox"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Khachatur Pepanian", email = "62070441+Yasinyan23@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "faststream[otel,prometheus,rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paystream = "paystream.workers.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "testcontainers[postgres,rabbitmq]>=4.13",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "PT", "RUF", "SIM", "C4", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "BLE001"]
"migrations/**" = ["N999"]
"scripts/**" = ["T201", "S311", "S113"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*", "aio_pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not e2e'"
markers = [
    "integration: needs Docker (testcontainers)",
    "e2e: runs against a live docker compose stack",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.coverage.run]
source = ["paystream"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# `...$`, not `...`: unanchored it also matches `tuple[Event, ...]` in a signature and hides that whole function.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
