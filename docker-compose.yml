name: paystream

x-app: &app
  build: .
  image: paystream:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://paystream:paystream@postgres:5432/paystream
    RABBITMQ_URL: amqp://paystream:paystream@rabbitmq:5672/
    API_KEYS: ${API_KEYS:-dev-api-key}
    WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}
    WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-webhook-sink}
    GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2.0}
    GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5.0}
    GATEWAY_SUCCESS_RATE: ${GATEWAY_SUCCESS_RATE:-0.9}
    RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
    RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-2000}
    CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-10}
    OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
    LOG_JSON: ${LOG_JSON:-true}
    METRICS_PORT: "9100"
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    # Used only when OTEL_ENABLED=true, with the jaeger service of the observability profile.
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paystream
      POSTGRES_USER: paystream
      POSTGRES_PASSWORD: paystream
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: the first boot runs a temporary server that listens on the unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U paystream -d paystream"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # The node name, and with it the data directory inside the volume, comes from the hostname.
    # Without a fixed one, a recreated container boots an empty broker and loses queued messages.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: paystream
      RABBITMQ_DEFAULT_PASS: paystream
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:15672:15672"

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  outbox-relay:
    <<: *app
    command: ["python", "-m", "paystream.workers.relay"]
    # Docker kills 10 s after SIGTERM by default; work in flight gets the broker's 30 s graceful timeout, plus a margin.
    stop_grace_period: 35s

  consumer:
    <<: *app
    command: ["python", "-m", "paystream.workers.consumer"]
    stop_grace_period: 35s

  webhook-sink:
    build: .
    image: paystream:local
    restart: unless-stopped
    command: ["uvicorn", "paystream.devtools.webhook_sink:create_app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw}
    ports:
      - "127.0.0.1:8080:8080"

  prometheus:
    image: prom/prometheus:v3.0.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/paystream.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  postgres-data:
  rabbitmq-data:
